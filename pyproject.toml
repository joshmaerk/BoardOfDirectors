[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "board-of-directors"
version = "0.1.0"
description = "Personal Board of Directors: dialogisches Sparring-System mit sechs AI-Personen, Roundtable-Debatte und SCQA-Synthese."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
board = "conductor.cli:main"

[tool.setuptools.packages.find]
include = ["conductor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
