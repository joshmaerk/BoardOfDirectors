[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "board-of-directors"
version = "0.1.0"
description = "Board of Directors: Roundtable-CLI (conductor) plus FastAPI backend for the Streamlit Board-of-Directors feature."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # conductor (CLI) deps — main
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    # app (HTTP API) deps
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "openai>=1.55",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "azure-identity>=1.19",
    "azure-ai-inference>=1.0.0b6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "types-python-jose>=3.3",
    "aiosqlite>=0.20",
]

[project.scripts]
board = "conductor.cli:main"

[tool.setuptools.packages.find]
include = ["conductor*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["conductor", "app"]
branch = true
omit = [
    "conductor/__init__.py",
    "app/__init__.py",
    "app/main.py",
    "alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "B008",   # function calls in argument defaults (FastAPI Depends, Click)
    "SIM117", # nested with-statements (sometimes clearer separately)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]
"tests/conftest.py" = ["E402", "N802", "N803", "N806"]
"alembic/env.py" = ["E402"]
"alembic/versions/*" = ["E402", "UP037"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["build/", "dist/", ".venv/", "alembic/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
