services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bod
      POSTGRES_PASSWORD: bod
      POSTGRES_DB: bod
    ports:
      - "5432:5432"
    volumes:
      - bod-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bod -d bod"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bod:bod@db:5432/bod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./app:/srv/app
      - ./alembic:/srv/alembic

volumes:
  bod-db:
